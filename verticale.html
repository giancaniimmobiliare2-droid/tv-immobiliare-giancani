<!DOCTYPE html>
<html lang="it">
<head>
  <script src="diretta_live_project/assets_antonio_fullbody.js"></script>
  <script src="antonio_fluid_engine.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🔴 IN ONDA VERTICALE — TV Immobiliare Interattiva | Immobiliare Giancani</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <style>
    :root {
      --gold: #d4a853;
      --gold-light: #ffd700;
      --gold-bright: #ffd700;
      --gold-glow: rgba(212, 168, 83, 0.5);
      --border-gold: rgba(212, 168, 83, 0.48);
      --border-gold-subtle: rgba(255, 255, 255, 0.22);
      --font-prezzo: 'Space Grotesk', 'Montserrat', sans-serif;
      --font-citta: 'Space Grotesk', sans-serif;
      --font-titolo: 'Montserrat', sans-serif;
      --font-corpo: 'Plus Jakarta Sans', sans-serif;
      --avatar-scale: 1.0;
      --avatar-pan-x: 0%;
      --avatar-pan-y: 0%;
      --avatar-rotate: 0deg;
    }

    body.tema-blu      { --gold: #00d2ff; --gold-light: #80eaff; --gold-bright: #38bdf8; --gold-glow: rgba(0,210,255,0.55); --border-gold: rgba(0,210,255,0.55); }
    body.tema-verde    { --gold: #10b981; --gold-light: #6ee7b7; --gold-bright: #34d399; --gold-glow: rgba(16,185,129,0.55); --border-gold: rgba(16,185,129,0.55); }
    body.tema-rosso    { --gold: #f43f5e; --gold-light: #fda4af; --gold-bright: #fb7185; --gold-glow: rgba(244,63,94,0.55); --border-gold: rgba(244,63,94,0.55); }
    body.tema-porpora  { --gold: #c084fc; --gold-light: #e9d5ff; --gold-bright: #d8b4fe; --gold-glow: rgba(192,132,252,0.55); --border-gold: rgba(192,132,252,0.55); }
    body.tema-turchese { --gold: #06b6d4; --gold-light: #67e8f9; --gold-bright: #22d3ee; --gold-glow: rgba(6,182,212,0.55); --border-gold: rgba(6,182,212,0.55); }
    body.tema-tramonto { --gold: #fb923c; --gold-light: #fed7aa; --gold-bright: #fdba74; --gold-glow: rgba(251,146,60,0.55); --border-gold: rgba(251,146,60,0.55); }
    body.tema-oro      { --gold: #d4a853; --gold-light: #fde68a; --gold-bright: #ffd700; --gold-glow: rgba(212,168,83,0.55); --border-gold: rgba(212,168,83,0.55); }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background: #040711 !important;
      color: #fff !important;
      font-family: var(--font-corpo) !important;
      user-select: none !important;
    }

    /* Stage 9:16 centrato su desktop e full-screen su smartphone */
    .vertical-broadcast-container {
      position: fixed !important;
      top: 0 !important;
      bottom: 0 !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: 100% !important;
      max-width: 480px !important;
      height: 100% !important;
      background: #060b16 !important;
      overflow: hidden !important;
      box-shadow: none !important;
      z-index: 10 !important;
    }

    @media (max-width: 520px) {
      .vertical-broadcast-container {
        max-width: 100% !important;
        box-shadow: none !important;
      }
    }

    /* 🖼️ IMMAGINE IMMOBILE PROTAGONISTA AL 100% (LUMINOUS, FULL BLEED, ZERO TAGLI) */
    .stage-background-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background: #070b14;
    }

    .room-photo-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 100% 50%;
      opacity: 0;
      transform: scale(1.02);
      transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity, object-position, transform;
    }

    @keyframes giancaniPanRightToLeft {
      0%   { object-position: 100% 50%; transform: scale(1.025); }
      76%  { object-position: 0% 50%;   transform: scale(1.045); }
      100% { object-position: 50% 50%;  transform: scale(1.030); }
    }

    .room-photo-slide.active {
      opacity: 1;
      animation: giancaniPanRightToLeft 15s ease-in-out forwards;
    }

    .room-photo-slide.pan-sweep {
      opacity: 1;
      animation: giancaniPanRightToLeft 15s ease-in-out forwards;
    }

    /* Sfumature cinematiche morbide (senza box netti, lasciano il centro della stanza luminoso) */
    .vignette-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 18%;
      background: linear-gradient(180deg, rgba(4, 8, 18, 0.74) 0%, rgba(4, 8, 18, 0.32) 55%, rgba(0, 0, 0, 0) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .vignette-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 44%;
      background: linear-gradient(0deg, rgba(4, 8, 18, 0.92) 0%, rgba(4, 8, 18, 0.66) 46%, rgba(4, 8, 18, 0.22) 78%, rgba(0, 0, 0, 0) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* ═══ 1. BARRA SUPERIORE SFUMATA SENZA BORDI (ZERO BOX NETTI) ═══ */
    .top-header-glass {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px 14px;
      border-radius: 0;
      background: linear-gradient(180deg, rgba(5, 9, 20, 0.72) 0%, rgba(5, 9, 20, 0.28) 68%, rgba(5, 9, 20, 0) 100%);
      border: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
    }

    .top-brand-cluster {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .brand-logo-full-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-logo-full-img {
      height: 48px;
      width: auto;
      max-width: 185px;
      object-fit: contain;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.96);
      padding: 3px 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.42);
    }

    .brand-live-badge-strip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.55);
      flex-shrink: 0;
    }

    .pulse-dot-live {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      animation: pulseLiveAnim 1.1s infinite alternate;
    }

    @keyframes pulseLiveAnim {
      0% { opacity: 0.45; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.25); }
    }

    .top-right-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .sync-status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 700;
      color: #cbd5e1;
      max-width: 90px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-audio-quick-toggle {
      background: linear-gradient(135deg, rgba(212, 168, 83, 0.28), rgba(212, 168, 83, 0.08));
      border: none;
      color: var(--gold-light);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 10px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: none;
      transition: all 0.2s ease;
    }

    .btn-audio-quick-toggle.muted {
      border: none;
      color: #fca5a5;
      background: linear-gradient(135deg, rgba(185, 28, 28, 0.52), rgba(127, 29, 29, 0.18));
    }

    /* ═══ 2. AVATAR CONDUTTORE A DESTRA SOPRA LA BARRA CHAT (NON COPRE LA STANZA!) ═══ */
    .daria-anchor-topright {
      position: absolute;
      bottom: 92px;
      right: 4px;
      width: 122px;
      height: 218px;
      z-index: 26;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      pointer-events: none;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.85));
    }

    #verticale-antonio-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .daria-actor-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .daria-portrait-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
    }

    .daria-eyes-container, .daria-eyebrow-layer, .daria-cheeks-glow,
    .dynamic-lip-rig-box, .daria-hands-rig, .pip-header-bar, .pip-caption-badge {
      display: none !important;
    }

    /* ═══ 3. ZONA INFERIORE ORDINATA: SCHEDA IMMOBILE VETRO + CHAT + PROGRESSO ═══ */
    .bottom-broadcast-zone {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 10px 10px;
      z-index: 25;
      display: flex;
      flex-direction: column;
      gap: 7px;
      pointer-events: none;
    }

    /* Fading Chat Bubbles (lasciano libero il lato destro per l'avatar!) */
    .daria-chat-zone {
      max-height: 78px;
      margin-right: 118px;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 4px;
      pointer-events: none;
    }

    .chat-bubble-daria {
      background: linear-gradient(90deg, rgba(6, 11, 24, 0.62) 0%, rgba(6, 11, 24, 0.34) 72%, rgba(6, 11, 24, 0) 100%);
      border: none;
      border-left: none;
      border-radius: 0;
      padding: 5px 14px 5px 4px;
      color: #f8fafc;
      font-size: 11px;
      line-height: 1.38;
      max-width: 100%;
      align-self: flex-start;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
      animation: bubbleSlideIn 0.28s ease-out;
      transition: opacity 1.2s ease;
      pointer-events: auto;
    }

    .chat-bubble-daria.fading { opacity: 0; }

    .chat-bubble-user {
      background: rgba(212, 168, 83, 0.90);
      color: #050814;
      border-radius: 10px 10px 0 10px;
      padding: 5px 9px;
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.3;
      max-width: 90%;
      align-self: flex-end;
      animation: bubbleSlideIn 0.28s ease-out;
      transition: opacity 1.2s ease;
      pointer-events: auto;
    }

    @keyframes bubbleSlideIn {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Scheda Immobile con Sfumatura Morbida senza Box Netti né Bordi (lascia respirare la stanza) */
    .property-glass-card {
      margin-right: 116px;
      background: linear-gradient(90deg, rgba(5, 9, 20, 0.56) 0%, rgba(5, 9, 20, 0.28) 68%, rgba(5, 9, 20, 0) 100%);
      border: none;
      border-left: none;
      border-radius: 0;
      padding: 6px 10px 6px 4px;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: auto;
    }

    .card-top-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .city-overline-title {
      font-family: var(--font-citta);
      font-size: 11px;
      font-weight: 800;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 0.9px;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.95);
    }

    .price-tag-condition-pill {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04));
      border: none;
      color: #f1f5f9;
      font-size: 8.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 999px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    .mega-price-display-text {
      font-family: var(--font-prezzo);
      font-size: clamp(20px, 5.2vw, 25px);
      font-weight: 900;
      color: #ffffff;
      line-height: 1.05;
      letter-spacing: -0.4px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.92), 0 1px 3px rgba(0, 0, 0, 0.85);
    }

    .property-title-main {
      font-family: var(--font-titolo);
      font-size: 12px;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.25;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.92);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .property-specs-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }

    .spec-pill-item {
      background: linear-gradient(90deg, rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.18));
      border: none;
      color: #f1f5f9;
      font-size: 9.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    .spec-pill-item.gold-highlight {
      border: none;
      color: var(--gold-light);
      background: linear-gradient(90deg, rgba(212, 168, 83, 0.28), rgba(212, 168, 83, 0.06));
    }

    /* Chip interattivi stanze nel player verticale (stile sfumato ultra-sottile) */
    .vert-room-chips {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      pointer-events: auto;
      padding: 1px 0;
    }
    .vert-room-chips::-webkit-scrollbar { display: none; }
    .vert-room-chip {
      border: none;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 10px;
      font-weight: 800;
      color: #f1f5f9;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.68), rgba(15, 23, 42, 0.25));
      backdrop-filter: blur(6px);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .vert-room-chip.active {
      color: #050814;
      background: linear-gradient(135deg, var(--gold), var(--gold-bright));
    }

    /* Chat Input & Barra Progresso Stanza */
    .chat-input-row {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }

    .chat-textarea-live {
      flex: 1;
      height: 36px;
      background: linear-gradient(90deg, rgba(8, 13, 28, 0.58) 0%, rgba(8, 13, 28, 0.24) 100%);
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      color: #ffffff;
      font-size: 11.5px;
      font-family: inherit;
      outline: none;
      resize: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .chat-textarea-live::placeholder { color: #94a3b8; }
    .chat-textarea-live:focus { border-color: var(--gold-bright); }

    .chat-send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-bright));
      border: none;
      color: #050814;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px var(--gold-glow);
      flex-shrink: 0;
    }

    .room-progress-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .room-pager-label {
      font-size: 9px;
      font-weight: 800;
      color: var(--gold-light);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .room-progress-track {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 3px;
      overflow: hidden;
    }

    .room-progress-fill {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    /* Overlay ingresso elegante */
    .audio-live-prompt-overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 7, 16, 0.58);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: pointer;
      transition: opacity 0.45s ease;
    }

    .audio-live-prompt-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .audio-live-pill {
      background: rgba(10, 17, 36, 0.90);
      border: 1.5px solid var(--gold);
      border-radius: 18px;
      padding: 18px 22px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 300px;
    }

    .btn-audio-enter {
      background: linear-gradient(135deg, #d4a853, #f59e0b);
      color: #050814;
      border: none;
      border-radius: 999px;
      padding: 9px 20px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="vertical-broadcast-container" id="broadcast-stage">

    <!-- 🖼️ STANZA IMMOBILE A TUTTO SCHERMO -->
    <div class="stage-background-layer">
      <img class="room-photo-slide active" id="current-room-photo"
           referrerpolicy="no-referrer"
           src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200&auto=format&fit=crop"
           alt="Stanza In Diretta">
    </div>

    <div class="vignette-top"></div>
    <div class="vignette-bottom"></div>

    <!-- 🏛️ HEADER SUPERIORE ULTRA-COMPATTO -->
    <header class="top-header-glass">
      <div class="top-brand-cluster">
        <div class="brand-logo-full-wrap" data-layout-item="logo">
          <img class="brand-logo-full-img" id="img-brand-logo"
               referrerpolicy="no-referrer"
               src="logo_giancani.png"
               onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/1BoZ_9QyYPRKjZFP__iPr7mmi0aGV0G3P';"
               alt="Immobiliare Giancani">
          <div class="brand-live-badge-strip">
            <span class="pulse-dot-live"></span> LIVE
          </div>
        </div>
        <div class="sync-status-indicator" id="sync-status-pill" data-layout-item="sync">
          <span>📡</span> <span id="sync-status-label">In Onda</span>
        </div>
      </div>

      <div class="top-right-controls">
        <button class="btn-audio-quick-toggle" id="btn-quick-audio-toggle" title="Attiva/Disattiva Audio Parlato">
          <span id="quick-audio-icon">🔊</span>
          <span id="quick-audio-label">AUDIO ON</span>
        </button>
      </div>
    </header>
    <a href="venditori.html" class="btn-audio-quick-toggle" style="position:absolute; top:58px; right:12px; z-index:95; text-decoration:none; color:#fde68a; font-size:10px; padding:4px 10px;" title="Vai alla Diretta Dedicata ai Venditori">📋 DIRETTA VENDITORI</a>

    <!-- 🎭 AVATAR A FIGURA INTERA IN BASSO A DESTRA (NON COPRE L'IMMOBILE) -->
    <div class="daria-anchor-topright" id="daria-pip-card" data-layout-item="avatar">
      <canvas id="verticale-antonio-canvas"></canvas>

      <div class="pip-header-bar"><div class="pip-wave-cluster"><span class="pip-audio-bar"></span></div></div>
      <div class="daria-actor-wrap" id="daria-actor-wrap">
        <img class="daria-portrait-element" id="daria-portrait-img" alt="Conduttore TV">
        <div class="daria-eyebrow-layer" id="daria-eyebrows"><div class="daria-eyebrow-unit"></div><div class="daria-eyebrow-unit"></div></div>
        <div class="daria-eyes-container" id="daria-eyes-box">
          <div class="daria-eye-unit"><span class="eye-catchlight"></span><div class="daria-eyelid-layer" id="daria-eyelid-left"></div></div>
          <div class="daria-eye-unit"><span class="eye-catchlight"></span><div class="daria-eyelid-layer" id="daria-eyelid-right"></div></div>

          cleanText += " — Immobiliare Giancani";
        }

        // 2. Riconoscimento Tag Pose & Gesti Mani

          tagMatches.forEach(tag => {
            const poseName = tag.replace('[', '').replace(']', '');
            if (AVATAR_POSES[poseName] !== undefined || poseName === 'neutra') {
              this.setPose(poseName);

            if (poseName === 'saluto') this.triggerHandGesture('wave');
            else if (poseName === 'presenta_prezzo') this.triggerHandGesture('price');
            else if (poseName === 'alza_mano_dx') this.triggerHandGesture('point');
            cleanText = cleanText.replace(tag, '');
          });
        } else {
          const low = cleanText.toLowerCase();
          if (low.includes('guarda a sinistra') || low.includes('si volta a sinistra') || low.includes('volta a sinistra')) {
            this.setPose('volta_sinistra');
          } else if (low.includes('ecco il prezzo') || low.includes('il prezzo è a sinistra') || low.includes('indica il prezzo')) {
            this.setPose('presenta_prezzo');
            this.triggerHandGesture('price');

            this.setPose('seducente');
          } else if (low.includes('indica la stanza') || low.includes('indica l\'ambiente')) {
            this.setPose('alza_mano_dx');
            this.triggerHandGesture('point');
          } else {
            this.setPose('neutra');
          }
        }

        cleanText = cleanText.replace(/<[^>]*>?/gm, '').trim();

        // 3. Sottotitolo live nella chat trasparente
        if (typeof addChatBubble === 'function') {
          addChatBubble(cleanText, 'daria');
        }

        // 4. Sintesi Vocale Neurale HD Unificata (stessa voce maschile di Orizzontale, zero doppi audio!)
        const pipCard = document.getElementById('daria-pip-card');
        this._speakGen = (this._speakGen || 0) + 1;
        const myGen = this._speakGen;
        this._audioPool = this._audioPool || [];

          const oldA = this._audioPool.pop();

            try { oldA.onended = null; oldA.onerror = null; oldA.onplay = null; oldA.pause(); oldA.src = ''; } catch(e) {}
          }
        }
        if (this._activeNeuralAudio) {

        const isFemaleChar = false;
        const neuralVoice = 'it-IT-GiuseppeMultilingualNeural';
        const sentences = (cleanText.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [cleanText]).map(s => s.trim()).filter(Boolean);
        let sIdx = 0;

        const finishAll = () => {
          if (myGen !== this._speakGen) return;
          this._activeNeuralAudio = null;
          this.isSpeaking = false;
          if (pipCard) pipCard.classList.remove('is-speaking');
          document.body.classList.remove('is-enthusiastic');
          if (typeof onComplete === 'function') onComplete();
        };

        const getAudioSrcForSentence = (seg, mode) => {
          if (mode === 0 && window.location && window.location.protocol !== 'file:' && !window._vertCloudTtsUnavailable) {
            return Promise.resolve('/tts?voice=' + encodeURIComponent(neuralVoice) + '&rate=-1%25&text=' + encodeURIComponent(seg.substring(0, 220)));
          }
          if (!isFemaleChar) {
            return fetch('https://tiktok-tts.weilnet.workers.dev/api/generation', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: seg.substring(0, 210), voice: 'it_male_m18' })
            }).then(r => r.json()).then(j => {
              if (!j || !j.data) throw new Error('Empty');
              return 'data:audio/mp3;base64,' + j.data;
            });
          }
          return Promise.resolve('https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=it&q=' + encodeURIComponent(seg.substring(0, 180)));
        };

        const playNextSentence = (mode) => {
          if (myGen !== this._speakGen) return;
          if (LiveSyncManager.audioMuted || sIdx >= sentences.length) {
            finishAll();
            return;
          }
          const curSentenceIdx = sIdx++;
          const seg = sentences[curSentenceIdx];
          getAudioSrcForSentence(seg, mode).then(srcUrl => {
            if (myGen !== this._speakGen) return;
            const a = new Audio(srcUrl);
            this._activeNeuralAudio = a;
            this._audioPool.push(a);

            let errHandled = false;
            const handleSentenceError = (errObj) => {
              if (errHandled || myGen !== this._speakGen) return;
              errHandled = true;
              a.onended = null;
              a.onerror = null;
              try { a.pause(); a.src = ''; } catch(e) {}
              if (errObj && errObj.name === 'NotAllowedError') {
                finishAll();
                return;
              }
              if (mode === 0) {
                window._vertCloudTtsUnavailable = true;
                sIdx = curSentenceIdx;
                playNextSentence(1);
              } else {
                finishAll();
              }
            };

            a.onplay = () => {
              if (myGen !== this._speakGen) { try { a.pause(); } catch(e){} return; }
              this.isSpeaking = true;
              if (pipCard) pipCard.classList.add('is-speaking');
              document.body.classList.add('is-enthusiastic');
            };
            a.onended = () => {
              if (errHandled || myGen !== this._speakGen) return;
              playNextSentence(mode);
            };
            a.onerror = () => handleSentenceError(null);
            a.play().catch((err) => handleSentenceError(err));
          }).catch(() => {
            if (myGen !== this._speakGen) return;
            if (mode === 0) {
              window._vertCloudTtsUnavailable = true;
              sIdx = curSentenceIdx;
              playNextSentence(1);
            } else {
              finishAll();
            }
          });
        };

        const startMode = (window.location && window.location.protocol !== 'file:' && !window._vertCloudTtsUnavailable) ? 0 : 1;
        playNextSentence(startMode);
        return;
      }
    };

          if (raw) {

              else this.state[k] = parsed[k];

                  if (elAvatar) {

                    } else {
                      elAvatar.src = 'assets/antonio_' + curPose + '_' + ev.data.colore + '.webp';
                    }
                  }
                } else if (ev.data.type === 'LAYOUT_UPDATED' && ev.data.layout) {
                  console.log("⚡ Layout ricevuto via BroadcastChannel in tempo reale:", ev.data.layout);
                  Object.keys(ev.data.layout).forEach(k => {
                    if (this.state[k]) Object.assign(this.state[k], ev.data.layout[k]);
                    else this.state[k] = ev.data.layout[k];
                  });
                  this.applyAll();
                  if (typeof DariaEngine !== 'undefined') DariaEngine.setPose('neutra');
                } else if (ev.data.type === 'AVATAR_CHANGED' && ev.data.character) {
                  console.log("⚡ Avatar cambiato in tempo reale:", ev.data.character);
                  if (!this.state.avatar) this.state.avatar = {};
                  this.state.avatar.character = ev.data.character;
                  this.applyAll();
                  if (typeof DariaEngine !== 'undefined') DariaEngine.setPose('neutra');
                } else if (ev.data.type === 'SEQUENCES_UPDATE') {
                  if (ev.data.data) {
                    try { localStorage.setItem('GIANCANI_AVATAR_SEQUENCES', JSON.stringify(ev.data.data)); } catch(e){}
                  }
                  if (ev.data.stableHead !== undefined) {
                    try { localStorage.setItem('GIANCANI_STABLE_HEAD_SPEECH', String(ev.data.stableHead)); } catch(e){}
                  }
                  if (typeof DariaEngine !== 'undefined') DariaEngine.setPose(DariaEngine.currentPose || 'neutra');
                }
              }
            };
          } catch(eBc) {}
        }

        // 2. Sincronizzazione storage cross-tab
        window.addEventListener('storage', (e) => {
          if (e.key === this.storageKey && e.newValue) {
            console.log("⚡ Ricevuto aggiornamento layout da storage:", e.newValue);
            this.loadSavedLayout();
            this.applyAll();
          } else if (e.key === 'GIANCANI_AVATAR_SEQUENCES' || e.key === 'GIANCANI_STABLE_HEAD_SPEECH') {

        });

          google.script.run
            .withSuccessHandler(onDone)
            .withFailureHandler(onErr)
            .getImmobileData(dirParam);
        } else {
          const webAppUrl = "https://script.google.com/macros/s/AKfycby2zYqPhMKSVn-jPoOvL8RS-92j2pjzImn8ll6VWMdVVG1VWuzEnGK5w4CU3Rv89EXYEA/exec";
          fetch(`${webAppUrl}?action=get_immobile_live&dir=${encodeURIComponent(dirParam)}`)
            .then(r => r.json())
            .then(data => {
              if (data && (data.immobile || data.stanza || data.titolo || data.mediaUrl)) onDone(data.immobile || data);
              else onDone(null);
            })
            .catch(onErr);
        }
      },

      applicaDatiRicevuti: function(data) {
        if (!data) return;
        this.currentData = data;

        // Se il server ha fornito manualOverride, allinea lo stato
        if (data.manualOverride && data.manualOverride.active) {
          this.manualOverride = data.manualOverride;
          try { localStorage.setItem('giancani_manual_override', JSON.stringify(data.manualOverride)); } catch(e) {}
        }

        // Se è attivo un override manuale (da server o locale), applica rigorosamente i valori manuali
        if (this.manualOverride && this.manualOverride.active) {
          if (this.manualOverride.prezzo) data.prezzo = this.manualOverride.prezzo;
          if (this.manualOverride.citta) { data.citta = this.manualOverride.citta; data.zona = this.manualOverride.citta; }
          if (this.manualOverride.titolo) data.titolo = this.manualOverride.titolo;
          if (this.manualOverride.superficie) data.mq = this.manualOverride.superficie;
          if (this.manualOverride.stanza) data.stanza = this.manualOverride.stanza;
        }

        if (data.prezzo) {
          document.getElementById('live-price-display').innerText = data.prezzo;
        }

        const cityText = (data.zona || data.citta || "FAVARA").toUpperCase();
        document.getElementById('live-city-display').innerText = cityText;

        const titleText = (data.titolo || "DIMORA ESCLUSIVA IN SICILIA").toUpperCase();
        document.getElementById('live-title-display').innerText = titleText;

        if (data.mq) {
          const supText = String(data.mq).replace(/(\d+)\s*(?:mq|m²|m2)\b/gi, "$1 metri quadri");
          document.getElementById('live-surface-badge').innerText = '📐 ' + supText;
        }

        if (this.manualOverride && this.manualOverride.stanza) {
          document.getElementById('live-room-badge').innerText = '📍 ' + this.manualOverride.stanza;
        }

        let rooms = [];
        if (Array.isArray(data.tutteLeStanze) && data.tutteLeStanze.length > 0) {
          rooms = data.tutteLeStanze;
        } else if (Array.isArray(data.elencoStanze) && data.elencoStanze.length > 0) {
          rooms = data.elencoStanze;
        } else {
          rooms = [{
            stanza: data.stanza || "Salone Panoramico",
            nome: data.stanza || "Salone Panoramico",
            fotoUrl: data.mediaUrl || data.fotoUrl || "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200",
            testo: data.testoDaLeggere || data.testo || ""
          }];
        }
        currentImmobileRooms = rooms;

        const isNewImmobile = (this.currentImmobileTitle !== titleText);
        if (isNewImmobile) {
          if ((DariaEngine.isSpeaking || (Date.now() - (this._lastRoomShownAt || 0) < 14000)) && this.currentImmobileTitle) {
            return;
          }
          console.log(`🎬 Nuovo immobile in onda: ${titleText}`);
          this.currentImmobileTitle = titleText;
          this.currentRoomIndex = 0;
          this.introDone = false;
          if (typeof aggiornaChipStanzeVerticali === 'function') aggiornaChipStanzeVerticali(rooms);
          this.conduciStanzaCorrente(true);
        } else if (typeof data.indiceCorrente === 'number' && data.indiceCorrente !== this.currentRoomIndex && !this.isAutoHosting && !DariaEngine.isSpeaking) {
          this.currentRoomIndex = data.indiceCorrente;
          this.conduciStanzaCorrente(false);
        }
      },

      conduciStanzaCorrente: function(isFirstIntroduction) {
        if (!currentImmobileRooms || currentImmobileRooms.length === 0) return;
        if (this.currentRoomIndex < 0) this.currentRoomIndex = 0;
        if (this.currentRoomIndex >= currentImmobileRooms.length) this.currentRoomIndex = 0;

        if (this.tourDelayTimeout) {
          clearTimeout(this.tourDelayTimeout);
          this.tourDelayTimeout = null;
        }

        const r = currentImmobileRooms[this.currentRoomIndex];
        if (!r) return;

        const isPresentazione = !!isFirstIntroduction && !this.introDone;
        const nomeStanza = isPresentazione ? '✨ Presentazione Immobile' : (r.stanza || r.nome || "Ambiente Esclusivo");
        const fotoUrl = r.fotoUrl || r.mediaUrl || r.url || "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200";

        // Aggiornamento Immediato Sfondo Stanza + Scorrimento Panoramico Destra->Sinistra 15s per vedere tutta la foto orizzontale
        this._lastRoomShownAt = Date.now();
        const bgImg = document.getElementById('current-room-photo');
        if (bgImg && fotoUrl) {
          bgImg.onerror = function() {
            this.onerror = null;
            this.src = "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200&auto=format&fit=crop";
          };
          if (bgImg.src !== fotoUrl) {
            bgImg.src = fotoUrl;
          }
          bgImg.classList.remove('active', 'pan-sweep');
          void bgImg.offsetWidth;
          bgImg.classList.add('active', 'pan-sweep');
          bgImg.style.opacity = '1';
        }

        document.getElementById('live-room-badge').innerText = isPresentazione ? nomeStanza : ('📍 ' + nomeStanza);
        if (isPresentazione) {
          document.getElementById('room-pager-text').innerText = `Presentazione • ${currentImmobileRooms.length} Stanze`;
          document.getElementById('room-progress-bar').style.width = '8%';
        } else {
          document.getElementById('room-pager-text').innerText = `Stanza ${this.currentRoomIndex + 1} di ${currentImmobileRooms.length}`;
          const pct = ((this.currentRoomIndex + 1) / currentImmobileRooms.length) * 100;
          document.getElementById('room-progress-bar').style.width = pct + '%';
        }

        // Estrazione Rigorosa Testo dalla Colonna F
        const data = this.currentData || {};
        const titolo = document.getElementById('live-title-display').innerText || 'questo immobile';
        const prezzo = document.getElementById('live-price-display').innerText || 'Trattativa in sede';
        const citta = document.getElementById('live-city-display').innerText || 'FAVARA';
        const sup = document.getElementById('live-surface-badge').innerText.replace('📐 ', '') || 'spazi generosi in metri quadri';

        let testoColonnaF = '';
        if (isPresentazione) {
          testoColonnaF = `Benvenuti nella diretta con Immobiliare Giancani! Vi presentiamo ${titolo} a ${citta}, proposta a ${prezzo} per una superficie di ${sup}. Scopriamo adesso tutte le ${currentImmobileRooms.length} stanze passo dopo passo, quindici secondi dedicati a ciascuna immagine — Immobiliare Giancani`;
        } else {
          testoColonnaF = String(r.testoF || r.testoDaLeggere || r.testo || data.testoDaLeggere || data.testo || '').trim();
          if (!testoColonnaF || testoColonnaF.length < 15) {
            testoColonnaF = `Ci troviamo adesso in ${nomeStanza} di ${titolo} a ${citta}. Ammirate i dettagli, la luminosità e gli spazi di questo ambiente curato nei minimi particolari. Scrivete in chat o toccate i pulsanti sotto per visitare subito la stanza che desiderate — Immobiliare Giancani`;
          } else if (testoColonnaF.indexOf('Immobiliare Giancani') === -1) {
            testoColonnaF += ' — Immobiliare Giancani';
          }
        }
        testoColonnaF = testoColonnaF.replace(/(\d+)\s*(?:mq|m²|m2)\b/gi, '$1 metri quadri');

        if (this.audioUnlocked && !this.audioMuted && this.isAutoHosting) {
          DariaEngine.speak(testoColonnaF, () => {
            this.onStanzaCompletata();
          });
        } else {
          if (typeof addChatBubble === 'function') {
            addChatBubble(testoColonnaF, 'daria');
          }
          if (this.isAutoHosting) {
            this.tourDelayTimeout = setTimeout(() => {
              this.passaAProssimaStanza();
            }, 15000);
          }
        }
      },

      onStanzaCompletata: function() {
        console.log("✅ Presentazione stanza completata");
        if (!this.isAutoHosting) return;

        // Garantisce rigorosamente almeno 15 secondi totali per ogni stanza prima di avanzare
        const elapsed = Date.now() - (this._lastRoomShownAt || Date.now());
        const remainingMs = Math.max(2800, 15000 - elapsed);
        this.tourDelayTimeout = setTimeout(() => {
          this.passaAProssimaStanza();
        }, remainingMs);
      },

      passaAProssimaStanza: function() {
        if (!currentImmobileRooms || currentImmobileRooms.length === 0) return;
        if (!this.introDone) {
          this.introDone = true;
          this.currentRoomIndex = 0;
          currentRoomIndex = 0;
          this.conduciStanzaCorrente(false);
          return;
        }
        if (this.currentRoomIndex + 1 >= currentImmobileRooms.length) {
          // Tutte le stanze dell'Immobile A completate -> passa ordinatamente all'Immobile B!
          this.currentRoomIndex = 0;
          currentRoomIndex = 0;
          this.introDone = false;
          const prevTitle = this.currentImmobileTitle;
          this.fetchLiveState('next_immobile');
          this.tourDelayTimeout = setTimeout(() => {
            if (this.currentImmobileTitle === prevTitle && !DariaEngine.isSpeaking) {
              this.conduciStanzaCorrente(true);
            }
          }, 3500);
          return;
        }
        this.currentRoomIndex = (this.currentRoomIndex + 1) % currentImmobileRooms.length;
        currentRoomIndex = this.currentRoomIndex;
        this.conduciStanzaCorrente(false);
      },

      toggleAudioMute: function() {
        this.audioMuted = !this.audioMuted;
        const btn = document.getElementById('btn-quick-audio-toggle');
        const icon = document.getElementById('quick-audio-icon');
        const lbl = document.getElementById('quick-audio-label');

        if (this.audioMuted) {
          try { window.speechSynthesis.cancel(); } catch(e) {}
          if (DariaEngine._activeNeuralAudio) { try { DariaEngine._activeNeuralAudio.pause(); } catch(e){} }
          if (icon) icon.innerText = '🔇';
          if (lbl) lbl.innerText = 'AUDIO MUTO';
          if (btn) btn.classList.add('muted');
        } else {
          if (icon) icon.innerText = '🔊';
          if (lbl) lbl.innerText = 'AUDIO LIVE ON';
          if (btn) btn.classList.remove('muted');
          this.conduciStanzaCorrente(false);
        }
      },

      setSyncStatus: function(isActive, label) {
        const lab = document.getElementById('sync-status-label');
        if (lab) lab.innerText = label || (isActive ? "In Onda" : "Standby");
      }
    };

    function sbloccaAudioDiretta() {
      const overlay = document.getElementById('live-audio-overlay');
      if (overlay) {
        overlay.classList.add('hidden');
        overlay.style.display = 'none';
        overlay.style.pointerEvents = 'none';
      }

      if (!LiveSyncManager.audioUnlocked) {
        LiveSyncManager.audioUnlocked = true;
        try {
          if (window.speechSynthesis) window.speechSynthesis.resume();
        } catch(e) {}
        console.log("🔊 Audio In Onda Sbloccato con successo!");
        LiveSyncManager.conduciStanzaCorrente(false);
      }
    }
    window.sbloccaAudioDiretta = sbloccaAudioDiretta;

    // ═══════════════════════════════════════════════════════════════════════
    // 💬 CHAT DARIA TRASPARENTE
    // ═══════════════════════════════════════════════════════════════════════
    function addChatBubble(text, tipo) {
      const chatZone = document.getElementById('daria-chat-zone');
      if (!chatZone) return;
      const bubble = document.createElement('div');
      bubble.className = tipo === 'daria' ? 'chat-bubble-daria' : 'chat-bubble-user';
      bubble.textContent = text;
      chatZone.appendChild(bubble);
      chatZone.scrollTop = chatZone.scrollHeight;
      setTimeout(() => {
        bubble.classList.add('fading');
        setTimeout(() => bubble.remove(), 1600);
      }, 8000);
    }

    // ═══════════════════════════════════════════════════════════════════════
    // 🚀 BOOTSTRAP PAGINA IN ONDA
    // ═══════════════════════════════════════════════════════════════════════
    function bootstrapInOndaVerticale() {
      try { DariaEngine.init(); } catch(eEng) { console.warn("DariaEngine init error:", eEng); }
      try { LayoutManager.init(); } catch(eLay) { console.warn("LayoutManager init error:", eLay); }
      try { LiveSyncManager.init(); } catch(eSync) { console.warn("LiveSyncManager init error:", eSync); }

      // 🌈 CICLO COLORI DINAMICO E RANDOM RICHIESTO DALL'UTENTE (Blu, Verde, Rosso, Porpora, Turchese, Tramonto, Oro)
      (function initColorThemes() {
        const TEMI = ['blu', 'verde', 'rosso', 'porpora', 'turchese', 'tramonto', 'oro'];
        let currentIdx = Math.floor(Math.random() * TEMI.length);
        function applyTheme(name) {
          TEMI.forEach(t => document.body.classList.remove('tema-' + t));
          document.body.classList.add('tema-' + name);
        }
        applyTheme(TEMI[currentIdx]);
        setInterval(() => {
          currentIdx = (currentIdx + 1 + Math.floor(Math.random() * (TEMI.length - 1))) % TEMI.length;
          applyTheme(TEMI[currentIdx]);
        }, 12000); // Cambia colore a random ogni 12 secondi con morbida transizione
      })();

      // Timer sicurezza anti-blackout: dissolve l'overlay automaticamente se non cliccato
      setTimeout(() => {
        const overlay = document.getElementById('live-audio-overlay');
        if (overlay && !LiveSyncManager.audioUnlocked) {
          overlay.style.transition = 'opacity 0.8s ease';
          overlay.style.opacity = '0';
          setTimeout(() => {
            if (overlay) {
              overlay.classList.add('hidden');
              overlay.style.display = 'none';
            }
          }, 800);
        }
      }, 3500);

      // Pulsante Audio Rapido On/Off
      const quickAudioBtn = document.getElementById('btn-quick-audio-toggle');
      if (quickAudioBtn) {
        quickAudioBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!LiveSyncManager.audioUnlocked) {
            sbloccaAudioDiretta();
          } else {
            LiveSyncManager.toggleAudioMute();
          }
        });
      }

      // Chat input
      const chatInput = document.getElementById('chat-input-daria');
      const chatSendBtn = document.getElementById('chat-send-btn');
      if (chatInput && chatSendBtn) {
        chatInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            inviaChatInOnda();
          }
        });
        chatSendBtn.addEventListener('click', inviaChatInOnda);
      }

      window.aggiornaChipStanzeVerticali = function(rooms) {
        const box = document.getElementById('vert-room-chips');
        if (!box || !Array.isArray(rooms)) return;
        const cats = [
          { label: 'Salotto', q: 'salotto', pats: ['salot', 'salon', 'soggiorn', 'living'] },
          { label: 'Cucina', q: 'cucina', pats: ['cucin', 'isola'] },
          { label: 'Camere', q: 'camera', pats: ['camer', 'matrimon', 'singol', 'letto'] },
          { label: 'Bagno', q: 'bagno', pats: ['bagn', 'wc', 'docc'] },
          { label: 'Esterno', q: 'esterno', pats: ['verand', 'terraz', 'piscin', 'giardin', 'estern', 'balcon', 'vista'] }
        ];
        box.innerHTML = '';
        cats.forEach(cat => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'vert-room-chip';
          btn.textContent = cat.label;
          btn.onclick = () => window.visitaStanzaVerticale(cat.q);
          box.appendChild(btn);
        });
      };

      window.visitaStanzaVerticale = function(queryText) {
        if (!queryText) return;
        if (chatInput) chatInput.value = queryText;
        inviaChatInOnda();
      };

      async function inviaChatInOnda() {
        const testo = chatInput.value.trim();
        if (!testo) return;

        addChatBubble(testo, 'utente');
        chatInput.value = '';

        if (LiveSyncManager.tourDelayTimeout) {
          clearTimeout(LiveSyncManager.tourDelayTimeout);
          LiveSyncManager.tourDelayTimeout = null;
        }
        DariaEngine.stopAudio();

        const q = testo.toLowerCase();
        const titolo = (document.getElementById('live-title-display')?.innerText || 'questo immobile').trim();
        const prezzo = (document.getElementById('live-price-display')?.innerText || 'trattativa in sede').trim();
        const citta = (document.getElementById('live-city-display')?.innerText || 'Favara').trim();
        const sup = (document.getElementById('live-surface-badge')?.innerText || '').replace('📐 ', '').trim() || 'ampia superficie in metri quadri';

        let matchedIdx = -1;
        if (Array.isArray(currentImmobileRooms)) {
          const numM = q.match(/stanza\s*(\d+)/);
          if (numM) {
            const ni = parseInt(numM[1], 10) - 1;
            if (ni >= 0 && ni < currentImmobileRooms.length) matchedIdx = ni;
          }
          if (matchedIdx === -1) {
            matchedIdx = currentImmobileRooms.findIndex(r => {
              const rn = (r.stanza || r.nome || '').toLowerCase();
              return ((q.includes('cucin') || q.includes('isol')) && (rn.includes('cucin') || rn.includes('isol')))
                || ((q.includes('salot') || q.includes('soggiorn') || q.includes('living') || q.includes('salon')) && (rn.includes('salon') || rn.includes('salot') || rn.includes('soggiorn') || rn.includes('living')))
                || ((q.includes('camer') || q.includes('lett') || q.includes('matrimon')) && (rn.includes('camer') || rn.includes('matrim') || rn.includes('matrin') || rn.includes('singol')))
                || ((q.includes('bagn') || q.includes('wc') || q.includes('docc') || q.includes('lavander')) && (rn.includes('bagn') || rn.includes('wc') || rn.includes('lavander')))
                || ((q.includes('estern') || q.includes('terraz') || q.includes('giardin') || q.includes('piscin') || q.includes('verand') || q.includes('balcon')) && (rn.includes('estern') || rn.includes('terraz') || rn.includes('vist') || rn.includes('piscin') || rn.includes('verand') || rn.includes('balcon')));
            });
          }
        }

        let risposta;
        if (matchedIdx !== -1 && currentImmobileRooms[matchedIdx]) {
          LiveSyncManager.introDone = true;
          LiveSyncManager.currentRoomIndex = matchedIdx;
          LiveSyncManager._lastRoomShownAt = Date.now();
          const roomObj = currentImmobileRooms[matchedIdx];
          const roomLabel = (roomObj.stanza || roomObj.nome || 'Ambiente').trim();
          const bgImg = document.getElementById('current-room-photo');
          if (bgImg && (roomObj.fotoUrl || roomObj.mediaUrl)) {
            bgImg.src = roomObj.fotoUrl || roomObj.mediaUrl;
            bgImg.classList.remove('active', 'pan-sweep');
            void bgImg.offsetWidth;
            bgImg.classList.add('active', 'pan-sweep');
            bgImg.style.opacity = '1';
          }
          document.getElementById('live-room-badge').innerText = '📍 ' + roomLabel;
          document.getElementById('room-pager-text').innerText = `Stanza ${matchedIdx + 1} di ${currentImmobileRooms.length}`;
          document.getElementById('room-progress-bar').style.width = (((matchedIdx + 1) / currentImmobileRooms.length) * 100) + '%';

          const rawDesc = String(roomObj.testoF || roomObj.testoDaLeggere || roomObj.testo || '').replace(/(\d+)\s*(?:mq|m²|m2)\b/gi, '$1 metri quadri').trim();
          const descBody = (rawDesc && rawDesc.length >= 12) ? rawDesc : `Stiamo visionando proprio ${roomLabel} di ${titolo} a ${citta}, proposta a ${prezzo} su ${sup}.`;
          risposta = `Certamente! Su tua richiesta ci spostiamo in ${roomLabel}: stiamo visionando proprio questo ambiente! ${descBody}`;
          if (!risposta.includes('Immobiliare Giancani')) risposta += ' — Immobiliare Giancani';
        } else if (q.includes('prezz') || q.includes('cost') || q.includes('quant')) {
          risposta = `Il prezzo per ${titolo} a ${citta} è ${prezzo}, per una superficie totale di ${sup}. Scrivici o chiama il 3201667156 — Immobiliare Giancani`;
        } else if (q.includes('metri') || q.includes('mq') || q.includes('superf') || q.includes('grand')) {
          risposta = `Questo immobile a ${citta} misura ${sup}, ed è proposto a ${prezzo}. Contattaci al 3201667156 per visitarlo — Immobiliare Giancani`;
        } else if (q.includes('dove') || q.includes('zona') || q.includes('indiriz') || q.includes('via')) {
          risposta = `La proprietà ${titolo} si trova a ${citta}. La nostra agenzia è in Corso Vittorio Veneto 151 a Favara, telefono 3201667156 — Immobiliare Giancani`;
        } else {
          risposta = `Grazie per la domanda su ${titolo} a ${citta} (${prezzo}, ${sup}). Tocca o scrivi il nome di una stanza come bagno, cucina o camera per vederla subito — Immobiliare Giancani`;
        }
        risposta = risposta.replace(/(\d+)\s*(?:mq|m²|m2)\b/gi, '$1 metri quadri');
        addChatBubble(risposta, 'daria');
        DariaEngine.speak(risposta, () => {
          LiveSyncManager.onStanzaCompletata();
        });
      }

      // Inizializza Avatar Antonio a Figura Intera (collo integro) nel riquadro in basso a destra
      (function initVerticaleFullbody() {
        if (typeof AntonioFluidRenderer === 'undefined') return;
        const canvas = document.getElementById('verticale-antonio-canvas');
        if (!canvas) return;
        const renderer = new AntonioFluidRenderer(canvas, { width: 768, height: 1376 });
        renderer.setArmSwingScale(0.70);
        renderer.setElbowBendScale(1.00);
        renderer.updateFacingFromStageX(84);
        const suit = (typeof window.calcolaColoreAbitoDiretta === 'function') ? window.calcolaColoreAbitoDiretta() : 'navy';
        ['standing', 'walking', 'arms_raised', 'gesturing'].forEach(function(pose) {
          const url = (typeof window.getAssetAntonioGiancani === 'function')
            ? window.getAssetAntonioGiancani(pose, suit)
            : ('assets/antonio_' + pose + '_' + suit + '.webp');
          renderer.loadPoseSource(pose, url);
        });
        let lastTs = 0, wasSpeaking = false, lastPoseSwitch = 0;
        function tickVert(ts) {
          if (!lastTs) lastTs = ts;
          const dt = Math.min((ts - lastTs) / 1000, 0.05);
          lastTs = ts;
          const speakingNow = !!(DariaEngine && DariaEngine.isSpeaking);
          if (speakingNow && !wasSpeaking) {
            lastPoseSwitch = ts;
            renderer.setPose('welcome_open', 1.35);
          } else if (!speakingNow && wasSpeaking) {
            renderer.setPose('neutral_poise', 1.45);
          } else if (speakingNow && (ts - lastPoseSwitch > 3600)) {
            lastPoseSwitch = ts;
            if (typeof renderer.nextExpressivePose === 'function') renderer.nextExpressivePose();
            else renderer.setPose('explain_points', 1.35);
          }
          wasSpeaking = speakingNow;
          const t = ts * 0.001;
          renderer.setBehavioralState({
            isSpeaking: speakingNow,
            speechEnergy: speakingNow ? 0.78 : 0,
            mouthOpen: speakingNow ? Math.max(0.08, Math.min(0.88, 0.42 + Math.sin(t * 14.5) * 0.34)) : 0,
            mouthWidth: speakingNow ? (0.95 + Math.sin(t * 7.5) * 0.1) : 1.0,
            isWalking: false,
            walkPhase: 0
          });
          renderer.update(dt);
          renderer.render();
          requestAnimationFrame(tickVert);
        }
        requestAnimationFrame(tickVert);
        window._verticaleAntonioRenderer = renderer;
      })();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrapInOndaVerticale);
    } else {
      bootstrapInOndaVerticale();
    }
  </script>
